<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Nexus — decentralized, encrypted, passwordless P2P chat.">
<meta property="og:title" content="Nexus — Passwordless P2P Chat">
<meta property="og:description" content="Private, encrypted, browser-only chat. No accounts. No servers. No logs.">
<meta property="og:type" content="website">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Nexus — Passwordless P2P Chat</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.08);
  --text: #e8e8ed;
  --text-dim: #8888a0;
  --accent: #7c5cff;
  --accent2: #00d4ff;
  --own-bubble: linear-gradient(135deg, #7c5cff, #5c3cff);
  --other-bubble: rgba(255,255,255,0.06);
  --radius: 18px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --shadow: 0 0 12px rgba(124,92,255,0.4);
}
[data-theme="light"] {
  --bg: #f5f5fa;
  --surface: rgba(0,0,0,0.04);
  --surface-hover: rgba(0,0,0,0.08);
  --border: rgba(0,0,0,0.08);
  --text: #0a0a0f;
  --text-dim: #555566;
  --own-bubble: linear-gradient(135deg, #7c5cff, #5c3cff);
  --other-bubble: rgba(0,0,0,0.05);
  --shadow: 0 0 12px rgba(124,92,255,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height:100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(124,92,255,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(0,212,255,0.1) 0%, transparent 60%);
  transition: background-color 0.3s, color 0.3s;
}
#app { display:flex; flex-direction:column; height:100dvh; max-width:840px; margin:0 auto; position:relative; }

header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 12px 16px;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 10; gap: 8px;
}
.logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; letter-spacing:-0.02em; }
.logo-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); box-shadow: var(--shadow);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.9); }
}
.header-actions { display:flex; align-items:center; gap:6px; }
.btn-icon {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 36px; height: 36px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; font-size: 15px;
}
.btn-icon:hover { background: var(--surface-hover); transform: translateY(-1px); }
.btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }
.online-badge {
  display: flex; align-items: center; gap: 6px; font-size: 12px;
  color: var(--text-dim); background: var(--surface);
  padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border);
}
.online-dot { width:6px; height:6px; border-radius:50%; background:#00e676; box-shadow:0 0 8px #00e676; }
.online-dot.offline { background:#ff5252; box-shadow:0 0 8px #ff5252; }

#messages {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 8px;
  scroll-behavior: smooth;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  max-width: 80%; padding: 10px 14px; border-radius: var(--radius);
  font-size: 15px; line-height: 1.45; word-break: break-word;
  animation: fadeInUp 0.25s ease-out; position: relative;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.own { align-self: flex-end; background: var(--own-bubble); color: #fff; border-bottom-right-radius: 6px; }
.msg.other { align-self: flex-start; background: var(--other-bubble); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
.msg.file-msg { padding: 10px 12px; max-width: 88%; }
.msg .meta { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
.msg.own .meta { color: rgba(255,255,255,0.7); }
.msg .time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; }
.msg.system {
  align-self: center; background: transparent; color: var(--text-dim);
  font-size: 12px; text-align: center; padding: 4px 12px;
  border-radius: 20px; border: 1px solid var(--border); max-width: 90%;
}

.file-card {
  display: flex; align-items: center; gap: 12px;
  background: rgba(0,0,0,0.2); border-radius: 12px; padding: 10px;
  margin-top: 6px; min-width: 220px;
}
.msg.own .file-card { background: rgba(0,0,0,0.25); }
.file-icon {
  width: 42px; height: 42px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  background: rgba(124,92,255,0.15); border: 1px solid rgba(124,92,255,0.25);
}
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.msg.own .file-name { color: #fff; }
.file-size { font-size: 11px; color: var(--text-dim); }
.msg.own .file-size { color: rgba(255,255,255,0.7); }
.progress-bar { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width 0.15s ease; border-radius: 2px; }
.file-download, .file-cancel {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; text-decoration: none; font-size: 15px; flex-shrink: 0;
  transition: all 0.2s;
}
.file-download:hover, .file-cancel:hover { background: var(--surface-hover); transform: translateY(-1px); }
.msg.own .file-download, .msg.own .file-cancel { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); color: #fff; }
.file-cancel { color: #ff6b6b; }
.msg.own .file-cancel { color: #ffb4b4; }

.media-preview {
  border-radius: 12px; overflow: hidden; margin-top: 6px;
  max-width: 320px; cursor: pointer; background: #000;
  position: relative; display: block;
}
.media-preview img, .media-preview video {
  display: block; width: 100%; height: auto; max-height: 320px;
  object-fit: contain; border-radius: 12px;
}
.media-preview audio { width: 100%; padding: 8px; }

#composer {
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
}
#composer input[type="text"] {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 12px 16px; border-radius: 24px;
  font-size: 15px; font-family: var(--font); outline: none;
  transition: border-color 0.2s;
}
#composer input[type="text"]:focus { border-color: var(--accent); }
#composer input[type="text"]::placeholder { color: var(--text-dim); }
.attach-btn, .send-btn {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; flex-shrink: 0; font-size: 18px;
  border: none;
}
.attach-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.attach-btn:hover { background: var(--surface-hover); }
.send-btn { background: var(--accent); color: #fff; }
.send-btn:hover { background: #6a4ce0; transform: scale(1.05); }
.send-btn:active { transform: scale(0.95); }

#toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface); backdrop-filter: blur(20px);
  border: 1px solid var(--border); color: var(--text);
  padding: 10px 20px; border-radius: 24px; font-size: 13px;
  opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100;
  max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#dropOverlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(124,92,255,0.15);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  border: 3px dashed var(--accent); border-radius: 20px;
  pointer-events: none;
}
#dropOverlay.active { display: flex; }
.drop-text { font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 0 20px rgba(124,92,255,0.8); text-align: center; padding: 24px; }

#lightbox {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.92);
  display: none; align-items: center; justify-content: center;
  padding: 20px; cursor: zoom-out;
}
#lightbox.active { display: flex; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }

.modal {
  position: fixed; inset: 0; z-index: 250;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.modal.active { display: flex; }
.modal-content {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 24px; max-width: 400px; width: 100%;
  text-align: center;
}
.modal-content h3 { font-size: 16px; margin-bottom: 16px; font-weight: 600; }
.modal-content img.qr { width: 100%; max-width: 280px; height: auto; border-radius: 12px; background: #fff; padding: 12px; }
.modal-content .url {
  font-size: 11px; color: var(--text-dim);
  word-break: break-all; margin: 12px 0 16px; padding: 8px;
  background: var(--surface); border-radius: 8px; font-family: monospace;
}
.modal-actions { display: flex; gap: 8px; }
.modal-actions button {
  flex: 1; padding: 10px; border-radius: 12px; cursor: pointer;
  font-family: var(--font); font-size: 13px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); transition: all 0.2s;
}
.modal-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-actions button:hover { transform: translateY(-1px); }

@media (max-width: 480px) {
  .msg { max-width: 88%; font-size: 14px; }
  .header-actions .btn-icon { width: 32px; height: 32px; font-size: 14px; }
  .logo span { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      <span>Nexus</span>
    </div>
    <div class="header-actions">
      <div class="online-badge" title="Peers in room">
        <div class="online-dot" id="onlineDot"></div>
        <span id="onlineCount">1</span>
      </div>
      <button class="btn-icon" id="themeToggle" title="Toggle theme">🌙</button>
      <button class="btn-icon" id="clearChat" title="Clear chat">🗑</button>
      <button class="btn-icon" id="qrBtn" title="Share via QR">📱</button>
      <button class="btn-icon" id="copyLink" title="Copy invite link">🔗</button>
    </div>
  </header>
  <main id="messages"></main>
  <form id="composer">
    <button type="button" class="attach-btn" id="attachBtn" title="Attach file">📎</button>
    <input type="file" id="fileInput" hidden multiple>
    <input type="text" id="input" placeholder="Type a secret..." autocomplete="off" maxlength="2000">
    <button type="submit" class="send-btn" aria-label="Send">➤</button>
  </form>
</div>
<div id="toast"></div>
<div id="dropOverlay"><div class="drop-text">Drop files to send</div></div>
<div id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="modal" id="qrModal">
  <div class="modal-content">
    <h3>Scan to join this room</h3>
    <img class="qr" id="qrImage" alt="Room QR code">
    <div class="url" id="qrUrl"></div>
    <div class="modal-actions">
      <button id="qrCloseBtn">Close</button>
      <button class="primary" id="qrCopyBtn">Copy Link</button>
    </div>
  </div>
</div>

<script type="module">
import { joinRoom } from 'https://esm.sh/trystero@0.21.5/torrent';
import QRCode from 'https://esm.sh/qrcode@1.5.3';

// ============ CONFIG ============
const APP_ID = 'nexus-p2p-chat-v1';
const CHUNK_SIZE = 32 * 1024;
const MAX_FILE_SIZE = 200 * 1024 * 1024;
const WARN_FILE_SIZE = 50 * 1024 * 1024;
const PBKDF2_ITERATIONS = 600000;   // OWASP current recommendation

// TURN config. For production, add your own TURN server below.
// Free options: Metered.ca (50 GB/mo), Twilio NTS (pay-as-you-go),
// or self-host coturn. Replace the null with your credentials object.
const TURN_CONFIG = null; // e.g. { urls: 'turn:...', username: '...', credential: '...' }

const iceServers = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
];
if (TURN_CONFIG) iceServers.push(TURN_CONFIG);

const RTC_CONFIG = { iceServers };

// ============ STATE ============
let roomId, roomKey, cryptoKey, room;
let userId = localStorage.getItem('nexus_userId') || crypto.randomUUID();
localStorage.setItem('nexus_userId', userId);
let nickname = localStorage.getItem('nexus_nickname') || 'Anon-' + userId.slice(0,4);
localStorage.setItem('nexus_nickname', nickname);

const incomingFiles = new Map();
const outgoingFiles = new Map();
const encoder = new TextEncoder();
const decoder = new TextDecoder();

// ============ UI ============
const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('input');
const composerEl = $('composer');
const onlineCountEl = $('onlineCount');
const onlineDot = $('onlineDot');
const copyLinkBtn = $('copyLink');
const toastEl = $('toast');
const attachBtn = $('attachBtn');
const fileInput = $('fileInput');
const dropOverlay = $('dropOverlay');
const lightbox = $('lightbox');
const lightboxImg = $('lightboxImg');
const themeToggle = $('themeToggle');
const clearChatBtn = $('clearChat');
const qrBtn = $('qrBtn');
const qrModal = $('qrModal');
const qrImage = $('qrImage');
const qrUrl = $('qrUrl');
const qrCloseBtn = $('qrCloseBtn');
const qrCopyBtn = $('qrCopyBtn');

// ============ UTILITIES ============
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}

function formatSpeed(bytesPerSec) {
  if (bytesPerSec < 1024) return bytesPerSec.toFixed(0) + ' B/s';
  if (bytesPerSec < 1024*1024) return (bytesPerSec/1024).toFixed(1) + ' KB/s';
  return (bytesPerSec/1024/1024).toFixed(1) + ' MB/s';
}

function fileIcon(type, name) {
  const n = (name || '').toLowerCase();
  if (type.startsWith('image/')) return '🖼️';
  if (type.startsWith('video/')) return '🎬';
  if (type.startsWith('audio/')) return '🎵';
  if (type === 'application/pdf' || n.endsWith('.pdf')) return '📕';
  if (n.match(/\.(zip|rar|7z|tar|gz)$/)) return '📦';
  if (n.match(/\.(doc|docx|odt|rtf)$/)) return '📘';
  if (n.match(/\.(xls|xlsx|ods|csv)$/)) return '📗';
  if (n.match(/\.(ppt|pptx|odp)$/)) return '📙';
  if (n.match(/\.(txt|md|log)$/)) return '📃';
  if (n.match(/\.(js|ts|py|html|css|json|xml|java|c|cpp|go|rs|rb|php)$/)) return '💻';
  return '📄';
}

function getRoomFromURL() {
  const hash = location.hash.slice(1);
  const params = new URLSearchParams(hash);
  let r = params.get('r');
  let k = params.get('k');
  if (!r || !k) {
    r = r || crypto.randomUUID().slice(0, 8);
    k = k || crypto.randomUUID().replace(/-/g, '');
    params.set('r', r);
    params.set('k', k);
    history.replaceState(null, '', '#' + params.toString());
  }
  return { roomId: r, roomKey: k };
}

// ============ CRYPTO ============
async function deriveKey(secret, salt) {
  const keyMaterial = await crypto.subtle.importKey(
    'raw', encoder.encode(secret), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: encoder.encode(salt), iterations: PBKDF2_ITERATIONS, hash:'SHA-256' },
    keyMaterial,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']
  );
}

async function encryptText(text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, cryptoKey, encoder.encode(text));
  return { iv: Array.from(iv), cipher: Array.from(new Uint8Array(cipher)) };
}

async function decryptText(data) {
  try {
    const iv = new Uint8Array(data.iv);
    const cipher = new Uint8Array(data.cipher);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, cryptoKey, cipher);
    return decoder.decode(plain);
  } catch { return null; }
}

async function encryptBuffer(buf) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, cryptoKey, buf);
  return { iv: Array.from(iv), cipher: new Uint8Array(cipher) };
}

async function decryptBuffer(cipherUint8, ivArray) {
  const iv = new Uint8Array(ivArray);
  return crypto.subtle.decrypt({ name:'AES-GCM', iv }, cryptoKey, cipherUint8);
}

function uint8ToBase64(u8) {
  let s = '';
  const step = 0x8000;
  for (let i = 0; i < u8.length; i += step) {
    s += String.fromCharCode.apply(null, u8.subarray(i, i + step));
  }
  return btoa(s);
}

function base64ToUint8(b64) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

function colorFromId(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
  return `hsl(${hash % 360}, 70%, 60%)`;
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    throw new Error('no clipboard API');
  } catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch { return false; }
  }
}

// ============ MESSAGE RENDERING ============
function buildMeta(nickname, msgUserId) {
  const meta = document.createElement('div');
  meta.className = 'meta';
  const nameSpan = document.createElement('span');
  nameSpan.textContent = nickname;
  nameSpan.style.color = colorFromId(msgUserId);
  nameSpan.style.fontWeight = '600';
  meta.appendChild(nameSpan);
  return meta;
}

function addTextMessage({ text, nickname, userId: msgUserId, timestamp, system }) {
  const div = document.createElement('div');
  if (system) {
    div.className = 'msg system';
    div.textContent = text;
  } else {
    const isOwn = msgUserId === userId;
    div.className = `msg ${isOwn ? 'own' : 'other'}`;
    div.appendChild(buildMeta(nickname, msgUserId));
    const body = document.createElement('div');
    body.textContent = text;
    div.appendChild(body);
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = new Date(timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    div.appendChild(time);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addFileMessage({ meta, isOwn }) {
  const { fileId, name, type, size, nickname, userId: msgUserId, timestamp } = meta;
  const div = document.createElement('div');
  div.className = `msg file-msg ${isOwn ? 'own' : 'other'}`;
  div.dataset.fileId = fileId;

  if (!isOwn) div.appendChild(buildMeta(nickname, msgUserId));

  const card = document.createElement('div');
  card.className = 'file-card';

  const iconEl = document.createElement('div');
  iconEl.className = 'file-icon';
  iconEl.textContent = fileIcon(type, name);

  const infoEl = document.createElement('div');
  infoEl.className = 'file-info';
  const nameEl = document.createElement('div');
  nameEl.className = 'file-name';
  nameEl.textContent = name;
  const sizeEl = document.createElement('div');
  sizeEl.className = 'file-size';
  sizeEl.textContent = formatSize(size);
  const progressWrap = document.createElement('div');
  progressWrap.className = 'progress-bar';
  const progressFill = document.createElement('div');
  progressFill.className = 'progress-fill';
  progressWrap.appendChild(progressFill);
  infoEl.appendChild(nameEl);
  infoEl.appendChild(sizeEl);
  infoEl.appendChild(progressWrap);

  const actionEl = document.createElement('div');
  actionEl.className = 'file-download';
  actionEl.textContent = '⬇';
  actionEl.style.display = 'none';

  const cancelEl = document.createElement('div');
  cancelEl.className = 'file-cancel';
  cancelEl.textContent = '✕';
  cancelEl.title = 'Cancel transfer';

  card.appendChild(iconEl);
  card.appendChild(infoEl);
  card.appendChild(cancelEl);
  card.appendChild(actionEl);
  div.appendChild(card);

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date(timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  div.appendChild(time);

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  return { div, card, progressFill, infoEl, actionEl, cancelEl, nameEl, iconEl, sizeEl };
}

function setProgress(ui, pct) {
  if (ui && ui.progressFill) ui.progressFill.style.width = Math.min(100, pct) + '%';
}

function finalizeFileMessage(ui, blob, meta) {
  const pb = ui.infoEl.querySelector('.progress-bar');
  if (pb) pb.remove();
  if (ui.cancelEl && ui.cancelEl.parentNode) ui.cancelEl.remove();

  const url = URL.createObjectURL(blob);
  const { type, name } = meta;

  ui.actionEl.style.display = 'flex';
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.style.cssText = 'text-decoration:none;color:inherit;width:100%;height:100%;display:flex;align-items:center;justify-content:center;';
  a.textContent = '⬇';
  ui.actionEl.textContent = '';
  ui.actionEl.appendChild(a);

  if (type.startsWith('image/')) {
    const wrap = document.createElement('div');
    wrap.className = 'media-preview';
    const img = document.createElement('img');
    img.src = url; img.alt = name; img.loading = 'lazy';
    img.addEventListener('click', () => { lightboxImg.src = url; lightbox.classList.add('active'); });
    wrap.appendChild(img);
    ui.div.insertBefore(wrap, ui.div.querySelector('.time'));
  } else if (type.startsWith('video/')) {
    const wrap = document.createElement('div');
    wrap.className = 'media-preview';
    const video = document.createElement('video');
    video.src = url; video.controls = true; video.preload = 'metadata';
    wrap.appendChild(video);
    ui.div.insertBefore(wrap, ui.div.querySelector('.time'));
  } else if (type.startsWith('audio/')) {
    const wrap = document.createElement('div');
    wrap.className = 'media-preview';
    const audio = document.createElement('audio');
    audio.src = url; audio.controls = true;
    wrap.appendChild(audio);
    ui.div.insertBefore(wrap, ui.div.querySelector('.time'));
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function markFileFailed(ui, reason) {
  const pb = ui.infoEl.querySelector('.progress-bar');
  if (pb) pb.remove();
  if (ui.cancelEl && ui.cancelEl.parentNode) ui.cancelEl.remove();
  ui.nameEl.textContent = reason || '⚠ Transfer failed';
  ui.nameEl.style.color = '#ff6b6b';
}

// ============ MAIN ============
async function init() {
  const { roomId: r, roomKey: k } = getRoomFromURL();
  roomId = r; roomKey = k;
  cryptoKey = await deriveKey(roomKey, roomId);

  addTextMessage({ text: `Room: ${roomId} — share the link to invite`, system: true });

  room = joinRoom({ appId: APP_ID, rtcConfig: RTC_CONFIG }, roomId);

  const [sendMsg, onMsg] = room.makeAction('msg');
  const [sendFileMeta, onFileMeta] = room.makeAction('fmeta');
  const [sendFileChunk, onFileChunk] = room.makeAction('fchunk');

  // --- Text ---
  onMsg(async (data) => {
    if (!data || !data.iv || !data.cipher) return;
    const plain = await decryptText(data);
    if (!plain) return;
    try { addTextMessage(JSON.parse(plain)); } catch {}
  });

  // --- File meta ---
  onFileMeta((meta) => {
    if (!meta || !meta.fileId) return;
    const ui = addFileMessage({ meta, isOwn: false });
    incomingFiles.set(meta.fileId, {
      meta, chunks: new Array(meta.totalChunks), received: 0, ui,
    });
  });

  // --- File chunks ---
  onFileChunk(async (data) => {
    if (!data || !data.fileId) return;
    const entry = incomingFiles.get(data.fileId);
    if (!entry) return;
    if (entry.chunks[data.index]) return;
    const bytes = base64ToUint8(data.data);
    entry.chunks[data.index] = bytes;
    entry.received++;
    const pct = (entry.received / entry.meta.totalChunks) * 100;
    setProgress(entry.ui, pct);
    if (entry.received === entry.meta.totalChunks) {
      let totalLen = 0;
      for (const c of entry.chunks) totalLen += c.length;
      const combined = new Uint8Array(totalLen);
      let off = 0;
      for (const c of entry.chunks) { combined.set(c, off); off += c.length; }
      try {
        const plain = await decryptBuffer(combined, entry.meta.iv);
        const blob = new Blob([plain], { type: entry.meta.type || 'application/octet-stream' });
        finalizeFileMessage(entry.ui, blob, entry.meta);
      } catch (e) {
        console.warn('File decrypt failed', e);
        markFileFailed(entry.ui, '⚠ Decryption failed');
      }
      incomingFiles.delete(data.fileId);
    }
  });

  // --- Send files ---
  async function sendFile(file) {
    if (file.size > MAX_FILE_SIZE) {
      toast(`File too large (max ${formatSize(MAX_FILE_SIZE)})`);
      return;
    }
    if (file.size > WARN_FILE_SIZE) toast(`Large file — may take a while`);

    const peerCount = Object.keys(room.getPeers() || {}).length;
    if (peerCount === 0) {
      toast('No peers connected yet — file will queue');
    }

    const fileId = crypto.randomUUID();
    const buf = await file.arrayBuffer();
    const { iv, cipher } = await encryptBuffer(buf);
    const totalChunks = Math.ceil(cipher.length / CHUNK_SIZE) || 1;

    const meta = {
      fileId, name: file.name || 'unnamed',
      type: file.type || 'application/octet-stream',
      size: file.size, totalChunks, iv,
      nickname, userId, timestamp: Date.now(),
    };

    const ui = addFileMessage({ meta, isOwn: true });
    setProgress(ui, 2);

    const outgoing = { file, el: ui, aborted: false, sent: 0 };
    outgoingFiles.set(fileId, outgoing);

    ui.cancelEl.addEventListener('click', () => {
      outgoing.aborted = true;
      markFileFailed(ui, '✕ Cancelled');
    });

    sendFileMeta(meta);

    const startTime = Date.now();
    let bytesSent = 0;

    for (let i = 0; i < totalChunks; i++) {
      if (outgoing.aborted) { outgoingFiles.delete(fileId); return; }
      const slice = cipher.subarray(i * CHUNK_SIZE, Math.min((i+1) * CHUNK_SIZE, cipher.length));
      sendFileChunk({ fileId, index: i, data: uint8ToBase64(slice) });
      bytesSent += slice.length;
      outgoing.sent++;

      if (i % 8 === 0 || i === totalChunks - 1) {
        const pct = 2 + (outgoing.sent / totalChunks) * 96;
        setProgress(ui, pct);
        const elapsed = (Date.now() - startTime) / 1000;
        if (elapsed > 0.5) {
          const speed = bytesSent / elapsed;
          ui.sizeEl.textContent = `${formatSize(file.size)} · ${formatSpeed(speed)}`;
        }
        await new Promise(res => setTimeout(res, 0));
      }
    }

    outgoingFiles.delete(fileId);
    if (!outgoing.aborted) {
      const blob = new Blob([buf], { type: meta.type });
      finalizeFileMessage(ui, blob, meta);
    }
  }

  // --- Composer ---
  composerEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    const payload = { text, nickname, userId, timestamp: Date.now() };
    const encrypted = await encryptText(JSON.stringify(payload));
    sendMsg(encrypted);
    addTextMessage(payload);
  });

  // --- Attach ---
  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const files = Array.from(fileInput.files || []);
    fileInput.value = '';
    for (const f of files) await sendFile(f);
  });

  // --- Paste ---
  document.addEventListener('paste', async (e) => {
    if (e.target === inputEl) return;
    const items = Array.from(e.clipboardData?.items || []);
    const files = items.filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);
    for (const f of files) await sendFile(f);
  });

  // --- Drag & drop ---
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    dropOverlay.classList.add('active');
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropOverlay.classList.remove('active');
  });
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove('active');
    const files = Array.from(e.dataTransfer?.files || []);
    for (const f of files) await sendFile(f);
  });

  // --- Lightbox ---
  lightbox.addEventListener('click', () => lightbox.classList.remove('active'));

  // --- Peers ---
  function updateOnline() {
    const count = Object.keys(room.getPeers() || {}).length + 1;
    onlineCountEl.textContent = count;
    onlineDot.classList.toggle('offline', count <= 1);
  }

  room.onPeerJoin(() => { updateOnline(); addTextMessage({ text: 'A peer joined', system: true }); });
  room.onPeerLeave(() => { updateOnline(); addTextMessage({ text: 'A peer left', system: true }); });

  // --- Copy link ---
  copyLinkBtn.addEventListener('click', async () => {
    const ok = await copyToClipboard(location.href);
    toast(ok ? 'Invite link copied' : 'Copy failed — long-press the URL bar');
  });

  // --- QR modal ---
  qrBtn.addEventListener('click', async () => {
    try {
      const url = location.href;
      qrUrl.textContent = url;
      const dataUrl = await QRCode.toDataURL(url, {
        width: 512, margin: 2,
        color: { dark: '#000000', light: '#ffffff' },
      });
      qrImage.src = dataUrl;
      qrModal.classList.add('active');
    } catch (err) {
      console.error(err);
      toast('QR generation failed');
    }
  });
  qrCloseBtn.addEventListener('click', () => qrModal.classList.remove('active'));
  qrCopyBtn.addEventListener('click', async () => {
    const ok = await copyToClipboard(location.href);
    toast(ok ? 'Copied' : 'Copy failed');
  });
  qrModal.addEventListener('click', (e) => { if (e.target === qrModal) qrModal.classList.remove('active'); });

  // --- Theme toggle ---
  const savedTheme = localStorage.getItem('nexus_theme') || 'dark';
  document.documentElement.dataset.theme = savedTheme;
  themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    themeToggle.textContent = next === 'dark' ? '🌙' : '☀️';
    localStorage.setItem('nexus_theme', next);
  });

  // --- Clear chat ---
  clearChatBtn.addEventListener('click', () => {
    if (!confirm('Clear all messages from this screen? (Files already received stay downloaded.)')) return;
    while (messagesEl.firstChild) messagesEl.removeChild(messagesEl.firstChild);
    incomingFiles.clear();
    for (const [id, entry] of outgoingFiles) entry.aborted = true;
    outgoingFiles.clear();
    addTextMessage({ text: 'Chat cleared locally', system: true });
  });

  setTimeout(updateOnline, 1000);
}

// ============ SERVICE WORKER ============
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW register failed', err));
  });
}

init().catch(err => {
  console.error(err);
  document.getElementById('messages').insertAdjacentHTML('beforeend',
    '<div class="msg system">Failed to initialize. Check console.</div>');
});
</script>
</body>
</html>
