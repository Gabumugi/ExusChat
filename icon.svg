<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#15152a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#7c5cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <g transform="translate(256 256)">
    <circle r="72" fill="url(#dot)"/>
    <circle r="72" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.6"/>
    <circle r="110" fill="none" stroke="#7c5cff" stroke-width="2" opacity="0.35"/>
    <circle r="148" fill="none" stroke="#7c5cff" stroke-width="1.5" opacity="0.15"/>
  </g>
